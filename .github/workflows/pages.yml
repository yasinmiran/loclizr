name: pages

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/loclizr/**
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site runs the loclizr binary from the workspace. pnpm links a
      # bin only when its file exists, and dist does not exist on a fresh
      # checkout, so build the package and link again before the site.
      - run: pnpm build
      - run: pnpm install --frozen-lockfile --offline
      - run: pnpm web:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
