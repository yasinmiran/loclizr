name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The example runs the loclizr binary from the workspace. pnpm links a
      # bin only when its file exists, and dist does not exist on a fresh
      # checkout, so build the package and link again before the gate.
      - run: pnpm build
      - run: pnpm install --frozen-lockfile --offline
      - run: pnpm check
